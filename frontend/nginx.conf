# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — serves Angular SPA and reverse-proxies /api → FastAPI backend
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── API reverse proxy → FastAPI backend ─────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads (must match backend MAX_UPLOAD_SIZE_MB)
        client_max_body_size 25M;
        proxy_read_timeout   120s;
    }

    # ── Static assets with long-lived cache ─────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Angular SPA — all other routes → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
